<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ficha — Tatsumaki ShadowHeart Gojo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__title" id="charName">Ficha</div>
      <div class="brand__sub" id="charMeta">—</div>
    </div>

    <div class="topbar__right">
      <button class="btn btn--ghost" id="btnNewRound" title="Restaura PV atual para PV máximo">Nova rodada</button>
      <button class="btn btn--ghost" id="btnFullReset" title="Restaura PS/PV/PF para máximo">Reset total</button>

      <label class="toggle">
        <input id="soundToggle" type="checkbox" checked />
        <span>Som</span>
      </label>
      <label class="toggle">
        <input id="motionToggle" type="checkbox" />
        <span>Sem animação</span>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2 class="panel__title">Recursos</h2>

        <div id="tracks" class="tracks"></div>
      </section>

      <section class="panel">
        <h2 class="panel__title">Rolador</h2>

        <div class="roller">
          <input id="rollInput" class="input" placeholder="Ex: 1d20 + @skills.FOR.Lutar.total" />
          <div class="row">
            <button class="btn" id="btnRoll">Rolar</button>
            <button class="btn btn--ghost" id="btnRollAdv" title="Rola 2d20 e pega o maior">Vantagem</button>
            <button class="btn btn--ghost" id="btnRollDis" title="Rola 2d20 e pega o menor">Desvantagem</button>
          </div>
          <div class="row row--wrap">
            <button class="chip" data-macro="1d20 + @skills.FOR.Lutar.total">Ataque (Lutar)</button>
            <button class="chip" data-macro="1d20 + @skills.DES.Reflexo.total">Reflexo</button>
            <button class="chip" data-macro="1d20 + @skills.SAB.Percepção.total">Percepção</button>
            <button class="chip" data-macro="1d20 + @skills.INT.Investigação.total">Investigação</button>
            <button class="chip" data-macro="1d20 + @skills.ARC.Ocultismo.total">Ocultismo</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel__title">Log</h2>
        <div class="log">
          <div class="row">
            <button class="btn btn--ghost" id="btnCopyLog">Copiar</button>
            <button class="btn btn--ghost" id="btnClearLog">Limpar</button>
          </div>
          <pre id="log" class="log__box"></pre>
        </div>
      </section>
    </aside>

    <section class="content">
      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-tab="overview">Visão geral</button>
        <button class="tab" data-tab="attributes">Atributos</button>
        <button class="tab" data-tab="skills">Perícias</button>
        <button class="tab" data-tab="combat">Combate</button>
        <button class="tab" data-tab="exclusive">Exclusivas</button>
      </nav>

      <section class="tabpane is-active" id="tab-overview"></section>
      <section class="tabpane" id="tab-attributes"></section>
      <section class="tabpane" id="tab-skills"></section>
      <section class="tabpane" id="tab-combat"></section>
      <section class="tabpane" id="tab-exclusive"></section>
    </section>
  </main>

  <div id="toastHost" class="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script src="./app.js"></script>
</body>
</html>
